<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32 Full Control & Telemetry Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>ESP32 IoT Control Center</h1>
      <div id="connection-status" class="status disconnected">Disconnected</div>
    </header>

    <main class="grid">
      <!-- Temperature Card + Control -->
      <div class="card" id="card-temp">
        <h2>Temperature</h2>
        <div class="value"><span id="temp-val">--</span> °C</div>
        <div id="temp-alert-msg" class="alert-tag normal">Normal</div>
        <div class="control-box">
          <label for="input-max-temp">Max Temp Threshold (°C):</label>
          <input type="number" id="input-max-temp" value="30" step="1" />
        </div>
      </div>

      <!-- Humidity Card + Control -->
      <div class="card" id="card-hum">
        <h2>Humidity</h2>
        <div class="value"><span id="hum-val">--</span> %</div>
        <div id="hum-alert-msg" class="alert-tag normal">Normal</div>
        <div class="control-box">
          <label for="input-max-hum">Max Humidity Threshold (%):</label>
          <input type="number" id="input-max-hum" value="70" step="1" />
        </div>
      </div>

      <!-- Distance Card + Range Control -->
      <div class="card">
        <h2>Ultrasonic Distance</h2>
        <div class="value"><span id="dist-val">--</span> cm</div>
        <p class="subtext">Trigger Zone: <span id="active-range">100 - 200</span> cm</p>
        <div class="control-box range-inputs">
          <div>
            <label for="input-min-dist">Min (cm):</label>
            <input type="number" id="input-min-dist" value="100" />
          </div>
          <div>
            <label for="input-max-dist">Max (cm):</label>
            <input type="number" id="input-max-dist" value="200" />
          </div>
        </div>
      </div>

      <!-- Servo Motor Card + Mode Control -->
      <div class="card">
        <h2>Servo Motor</h2>
        <div class="value">
          <span id="servo-badge" class="badge stopped">STOPPED</span>
        </div>
        <p class="subtext">Angle: <strong id="servo-angle">0</strong>° | Mode: <strong id="mode-label">AUTO</strong></p>
        <div class="controls">
          <button id="btn-auto" class="btn btn-auto">AUTO</button>
          <button id="btn-run" class="btn btn-run">RUN</button>
          <button id="btn-stop" class="btn btn-stop">STOP</button>
        </div>
      </div>
    </main>

    <div class="apply-bar">
      <button id="btn-apply" class="btn-apply">Send Thresholds to ESP32</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
